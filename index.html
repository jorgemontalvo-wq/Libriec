<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de aceites LUBRIEC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#F7F8F6;--card:#FFFFFF;--ink:#1F2A24;--mut:#6B766F;--line:#E3E7E2;--pri:#2A4535;--priInk:#FFFFFF;--acc:#9A7B3A;--ok:#3F7050;--warn:#9A7B3A;--bad:#A3392F;--soft:#F1F4F0;--c1:#2A4535;--c2:#9A7B3A;--c3:#6C7F8F;--sh:0 1px 2px rgba(20,30,25,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121714;--card:#1A211D;--ink:#E8ECE8;--mut:#9AA69F;--line:#2B3530;--pri:#5F8F73;--soft:#202824;--acc:#C9A55A;--ok:#6FB287;--warn:#C9A55A;--bad:#E0766B;--c1:#7FB095;--c2:#C9A55A;--c3:#8FA6B8;--sh:none}}
:root[data-theme="dark"]{--bg:#121714;--card:#1A211D;--ink:#E8ECE8;--mut:#9AA69F;--line:#2B3530;--pri:#5F8F73;--soft:#202824;--acc:#C9A55A;--ok:#6FB287;--warn:#C9A55A;--bad:#E0766B;--c1:#7FB095;--c2:#C9A55A;--c3:#8FA6B8;--sh:none}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);color:var(--ink);display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line)}
header.top .sub{font-size:12px;color:var(--mut);line-height:1.15}
header.top .sp{flex:1}
header.top select{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 9px;max-width:160px}
.logobox{background:#fff;border-radius:10px;padding:2px 6px;display:flex}.logo{height:36px;width:auto;display:block}
main{max-width:1000px;margin:0 auto;padding:16px 14px 96px}
h1,h2{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
h1{font-size:26px;margin:6px 0 12px;font-weight:600;color:var(--ink)}
h2{font-size:20px;margin:22px 0 8px;font-weight:500}
h3{font-size:15px;margin:12px 0 6px;font-weight:700}
.mut{color:var(--mut)}.small{font-size:13px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 0 14px}
.hero .hi{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:600;color:var(--ink);line-height:1.1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:104px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);text-align:left;cursor:pointer;font-weight:600;font-size:15.5px;position:relative;overflow:hidden}
.tile .em{width:40px;height:40px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:21px;line-height:1}
.tile.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri);min-height:132px;font-size:18px}
.tile.pri .em{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.tile .d{font-weight:400;font-size:12.5px;opacity:.82}
.tile:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;box-shadow:var(--sh)}
.card.alert{border-color:var(--bad);border-width:2px}.card.okc{border-color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--pri);background:var(--card);color:var(--pri);border-radius:10px;padding:10px 15px;font-weight:600;cursor:pointer;min-height:44px}
.btn.pri{background:var(--pri);color:var(--priInk)}.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{display:block;margin:8px 0}.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.fld small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);min-height:44px}
.fld textarea{min-height:70px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600;font-size:12.5px;color:var(--mut);position:sticky;top:0}
td.n,th.n{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft)}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.badge.red{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.err{background:color-mix(in srgb,var(--bad) 11%,transparent);border:1.5px solid var(--bad);border-radius:14px;padding:10px 13px;margin:10px 0}
.err ul{margin:4px 0 0 18px;padding:0}
.note{background:var(--soft);border-radius:14px;padding:11px 13px;margin:10px 0;font-size:14px}
.pend{color:var(--acc);font-weight:700}
.prog{display:flex;gap:5px;margin:6px 0 4px}.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog i.d{background:var(--pri)}.prog i.c{background:var(--acc)}
.big{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{font-weight:600;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:space-between;z-index:15;}
.nav .btn{flex:1;max-width:340px}
.ph{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph img{width:150px;height:150px;object-fit:cover;border-radius:14px;border:1px solid var(--line);cursor:zoom-in;background:#000}
.ph .acts{display:flex;flex-direction:column;gap:8px}
.sig{width:100%;height:120px;border:1.5px dashed var(--line);border-radius:14px;background:#fff;touch-action:none;display:block}
.modal{position:fixed;inset:0;background:rgba(20,28,24,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal.img img{max-width:100%;max-height:92vh;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1F2A24;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:14px;max-width:90vw}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mut);font-size:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 15px;font-weight:600;cursor:pointer;min-height:36px}
.tabs button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.gauge{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar i.hi{background:var(--acc)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.acta{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:18px}
.acta h1,.acta h2,.acta h3{color:#111}.acta h3{margin-top:14px}
.acta table th{background:#e9eeec;color:#111}.acta td,.acta th{border-color:#bbb}
.acta .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.acta .photos img{width:100%;border:1px solid #999}
.acta .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.acta .sigs div{border-top:1px solid #111;padding-top:4px;text-align:center;font-size:13px}.acta .sigs img{height:60px;display:block;margin:0 auto}
@media print{header.top,.nav,.noprint,.toast{display:none!important}main{padding:0}body{background:#fff}.acta{border:0;padding:0;box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logobox"><img class="logo" alt="LUBRIEC S.A."></div><div class="sub">Control de aceites<br>a granel</div>
  <div class="sp"></div>
  <select id="userSel" aria-label="Usuario activo"></select>
</header>
<main id="app"></main>
<div id="navbar"></div>

const IDB={db:null,mem:{kv:{},photos:{}},ok:false,
 open(){return new Promise(res=>{try{if(!window.indexedDB){res();return}const r=indexedDB.open('lubriec-control',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('photos')};r.onsuccess=()=>{this.db=r.result;this.ok=true;res()};r.onerror=()=>res()}catch(e){res()}})},
 get(st,k){if(!this.ok)return Promise.resolve(this.mem[st][k]);return new Promise(res=>{const q=this.db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})},
 put(st,k,v){if(!this.ok){this.mem[st][k]=v;return Promise.resolve()}return new Promise(res=>{const tx=this.db.transaction(st,'readwrite');tx.objectStore(st).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()})},
 all(st){if(!this.ok)return Promise.resolve(Object.entries(this.mem[st]));return new Promise(res=>{const out=[];const q=this.db.transaction(st).objectStore(st).openCursor();q.onsuccess=()=>{const c=q.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};q.onerror=()=>res(out)})}
};

function interp(tab,x){if(!tab||tab.length<2)return null;if(x<tab[0][0]||x>tab[tab.length-1][0])return null;
 for(let i=0;i<tab.length;i++){if(tab[i][0]===x)return Math.round(tab[i][1])}
 for(let i=1;i<tab.length;i++){if(x<tab[i][0]){const[a,b]=[tab[i-1],tab[i]];return Math.round(a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]))}}return null}
function vol(t,mm){if(!t||mm==null||isNaN(mm)||mm<0)return null;
 if(t.modelo==='tabla'&&t.tabla&&t.tabla.length>1)return interp(t.tabla,mm);
 if(t.modelo==='horizontal'&&t.diam&&t.largo){const R=t.diam/2;if(mm>t.diam)return null;const a=R*R*Math.acos((R-mm)/R)-(R-mm)*Math.sqrt(Math.max(0,2*R*mm-mm*mm));return Math.round(a*t.largo/1e9*GAL)}
 if(t.modelo==='vertical'&&t.diam)return Math.round(Math.PI*Math.pow(t.diam/1000,2)/4*(mm/1000)*GAL);
 return null}
const metodoTxt=t=>(t.modelo!=='tabla'&&!t.diam)?PEND+': diámetro del tanque':t.modelo==='tabla'?`Tabla de aforo (${(t.tabla||[]).length} puntos), interpolación lineal entre puntos consecutivos; sin extrapolación`:t.modelo==='horizontal'?`Cilindro horizontal Ø${fmt(t.diam)} × ${fmt(t.largo)} mm (segmento circular)`:`Cilindro vertical Ø${fmt(t.diam)} mm (lineal: ${fmt(Math.PI*Math.pow(t.diam/1000,2)/4*GAL/1000,4)} gl/mm)`;

/* ============ flujos ============ */
const FLOW={
 REC:{n:'Recepción',p:'REC',slots:{tqIni:{l:'Varillaje inicial del tanquero',k:'tq'},tkIni:{l:'Varillaje inicial del tanque receptor',k:'tk',t:'tank'},tqFin:{l:'Varillaje final del tanquero',k:'tq'},tkFin:{l:'Varillaje final del tanque receptor',k:'tk',t:'tank'}}},
 DES:{n:'Despacho',p:'DES',slots:{vacio:{l:'Foto: tanquero vacío antes de cargar',k:'ph'},tkIni:{l:'Medición inicial del tanque de origen',k:'tk',t:'tank'},tqIni:{l:'Medición inicial del tanquero',k:'tq'},tkFin:{l:'Medición final del tanque de origen',k:'tk',t:'tank'},tqFin:{l:'Medición final del tanquero',k:'tq'}}},
 TRV:{n:'Trasvase / producción',p:'TRV',slots:{oIni:{l:'Tanque de origen · medición inicial',k:'tk',t:'tank'},dIni:{l:'Tanque de destino · medición inicial',k:'tk',t:'tank2'},oFin:{l:'Tanque de origen · medición final',k:'tk',t:'tank'},dFin:{l:'Tanque de destino · medición final',k:'tk',t:'tank2'}}},
 VAR:{n:'Varillaje de inventario',p:'VAR',slots:{r:{l:'Varillaje del tanque',k:'tk',t:'tank'}}},
 AJU:{n:'Ajuste autorizado',p:'AJU',slots:{}}
};
const G=(o,s)=>{const m=o.m&&o.m[s];return m&&m.gal!=null?m.gal:null};
const sub=(a,b)=>(a==null||b==null)?null:a-b;
function rtime(o,m){return new Date((o.f.fecha||today())+'T'+((m&&m.hora)||o.f.horaIni||'00:00')+':00').getTime()}
function whenOf(o){let w=null;for(const m of Object.values(o.m||{})){if(m&&m.hora){const t=rtime(o,m);if(w==null||t>w)w=t}}return w!=null?w:new Date((o.f.fecha||today())+'T'+(o.f.horaIni||'00:00')+':00').getTime()}
const A_=o=>o.f.docVol;
const tqOn=o=>o.f.tqVarilla!==false;
const tqChk=o=>`<label class="row" style="margin:8px 0"><input type="checkbox" data-p="f.tqVarilla" ${tqOn(o)?'checked':''}> El tanquero tiene varilla (se mide su varillaje)</label>`;
const B_=o=>!tqOn(o)?null:o.tipo==='REC'?sub(G(o,'tqIni'),G(o,'tqFin')):sub(G(o,'tqFin'),G(o,'tqIni'));
const C_=o=>sub(G(o,'tkFin'),G(o,'tkIni'));
const T_=o=>sub(G(o,'tkIni'),G(o,'tkFin'));
function recG(o){const a=A_(o),b=B_(o),c=C_(o);const k=S.settings.baseRecepcion;const v=k==='documento'?a:k==='tanquero'?b:c;return v!=null?v:c}
function desG(o){const d=o.f.docVol!=null?o.f.docVol:o.f.solicitado,q=B_(o),t=T_(o);const k=S.settings.baseDespacho;const v=k==='documento'?d:k==='tanquero'?q:t;return v!=null?v:t}
function evs(id){const r=[];for(const o of S.ops){if(o.estado!=='cerrada')continue;const w=whenOf(o),f=o.f;
 if(o.tipo==='REC'&&f.tank===id)r.push({w,o,k:'REC',g:recG(o)||0});
 if(o.tipo==='DES'&&f.tank===id)r.push({w,o,k:'DES',g:-(desG(o)||0)});
 if(o.tipo==='TRV'){if(f.tank===id)r.push({w,o,k:'TRV',g:-(sub(G(o,'oIni'),G(o,'oFin'))||0)});if(f.tank2===id)r.push({w,o,k:'TRV',g:sub(G(o,'dFin'),G(o,'dIni'))||0})}
 if(o.tipo==='AJU'&&f.tank===id)r.push({w,o,k:'AJU',g:Number(f.gal)||0})}
 return r.sort((a,b)=>a.w-b.w)}
function rds(id){const r=[];const t0=tk(id);if(t0&&t0.base)r.push({ts:t0.base.ts,m:{mm:t0.base.mm,gal:t0.base.gal,hora:'23:59'},o:{id:'INVENTARIO',f:{}},s:'base'});for(const o of S.ops){if(o.estado!=='cerrada')continue;const fl=FLOW[o.tipo];for(const[s,m]of Object.entries(o.m||{})){const d=fl.slots[s];if(!m||m.gal==null||!d||d.k!=='tk'||o.f[d.t]!==id)continue;r.push({ts:rtime(o,m),m,o,s})}}return r.sort((a,b)=>a.ts-b.ts)}
function theo(id,cut=Infinity){const t=tk(id);if(!t||t.saldo==null)return null;let g=t.saldo;for(const e of evs(id)){if(e.w>=t.saldoW&&e.w<=cut)g+=e.g}return g}
function phys(id,cut=Infinity,from=-Infinity){let l=null;for(const r of rds(id)){if(r.ts<=cut&&r.ts>=from)l=r}return l}
function sem(p){const w=S.settings.tolWarn,r=S.settings.tolRed;if(p==null)return'na';if(w==null||r==null)return'pend';const a=Math.abs(p);return a<=w?'ok':a<=r?'warn':'red'}
const semRank={na:0,pend:.5,ok:1,warn:2,red:3};
const worst=a=>a.reduce((x,y)=>semRank[y]>semRank[x]?y:x,'na');
const badge=s=>`<span class="badge ${s==='ok'?'ok':s==='warn'?'warn':s==='red'?'red':''}">${SEM[s]} ${SEMTXT[s]}</span>`;

/* conciliación por tipo */
function conc(o){const out={items:[],diffs:[],sem:'na'};
 if(o.tipo==='REC'){const A=A_(o),B=B_(o),C=C_(o);out.items=[['Documento (A)',A],['Tanquero (B)',B],['Tanque receptor (C)',C]];
  out.diffs=[['A − B',sub(A,B),A],['A − C',sub(A,C),A],['B − C',sub(B,C),B]]}
 else if(o.tipo==='DES'){const S_=o.f.solicitado,D=o.f.docVol,T=T_(o),Q=B_(o);out.items=[['Solicitado',S_],['Documento',D],['Disminución del tanque',T],['Cargado al tanquero',Q]];
  out.diffs=[['Tanque − Solicitado',sub(T,S_),S_],['Tanque − Documento',sub(T,D),D],['Tanque − Tanquero',sub(T,Q),Q],['Tanquero − Documento',sub(Q,D),D]]}
 else if(o.tipo==='TRV'){const O=sub(G(o,'oIni'),G(o,'oFin')),E=sub(G(o,'dFin'),G(o,'dIni'));out.items=[['Salida del origen',O],['Entrada al destino',E]];out.diffs=[['Entrada − Salida',sub(E,O),O]]}
 out.diffs=out.diffs.filter(d=>d[1]!=null).map(d=>({n:d[0],g:d[1],p:pc(d[1],d[2])}));
 out.sem=out.diffs.length?worst(out.diffs.map(d=>sem(d.p))):'na';return out}
function summ(o){const c=conc(o),f=o.f;let vDoc=f.docVol,vTq=null,vTk=null;
 if(o.tipo==='REC'){vTq=B_(o);vTk=C_(o)}else if(o.tipo==='DES'){vTq=B_(o);vTk=T_(o)}else if(o.tipo==='TRV'){vDoc=null;vTq=sub(G(o,'oIni'),G(o,'oFin'));vTk=sub(G(o,'dFin'),G(o,'dIni'))}else if(o.tipo==='VAR'){vTk=G(o,'r')}else if(o.tipo==='AJU'){vTk=Number(f.gal)}
 let main=null;if(c.diffs.length){main=c.diffs.reduce((a,b)=>Math.abs(b.p||0)>Math.abs(a.p||0)?b:a)}
 return{vDoc,vTq,vTk,dg:main?main.g:null,dp:main?main.p:null,sem:c.sem}}

 m:{},conc:{obs:'',responsable:'',accion:'',ev:null},firmas:{},hist:[],fotoLog:[]};

async function sha256(buf){try{const h=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return'no-disponible'}}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('No se pudo leer la imagen'));i.src=u})}
async function addPhoto(file,slot,source){const o=CUR;const dd=FLOW[o.tipo].slots[slot];if(dd.k==='ph'&&!o.m[slot])o.m[slot]={hora:hhmm(),user:uname(),ts:nowISO()};const m=o.m[slot];if(!m||(dd.k!=='ph'&&m.mm==null)){toast('Ingrese primero la lectura');return}
 const buf=await file.arrayBuffer();const sha=await sha256(buf);const img=await loadImg(file);
 const sc=Math.min(1,1600/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
 const fs=Math.max(14,Math.round(w/42));x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,h-fs*2.7,w,fs*2.7);x.fillStyle='#fff';x.font='600 '+fs+'px sans-serif';
 const lab=FLOW[o.tipo].slots[slot].l;x.fillText('LUBRIEC · '+o.id+' · '+lab,fs*.5,h-fs*1.55);x.fillText(fts(nowISO())+' · '+uname()+(m.mm!=null?' · lectura '+m.mm+' mm':''),fs*.5,h-fs*.4);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
 const id='PH-'+o.id+'-'+slot+'-'+Date.now();
 const meta={ts:nowISO(),user:uname(),op:o.id,slot,sha256:sha,archivo:file.name||'',tamanoOriginal:file.size,fechaArchivo:file.lastModified?new Date(file.lastModified).toISOString():'',origen:source,ancho:w,alto:h,lectura:m.mm==null?null:m.mm};
 await IDB.put('photos',id,{blob,meta});
 if(m.fotoId){o.fotoLog.push({ts:nowISO(),user:uname(),slot,anterior:m.fotoId,nueva:id});audit('reemplazar foto',o.id,slot)}
 m.fotoId=id;m.fotoMm=m.mm==null?null:m.mm;m.fotoMeta=meta;audit('foto',o.id,slot);save();render()}

function rStock(){const rows=stockRows();const sel=V.p.tank||rows[0].t.id;
 return`${back()}<h1>Stock actual</h1>
 <div class="note small">Stock teórico = saldo inicial + recepciones − despachos ± trasvases y ajustes autorizados (base de recepción: <b>${esc(S.settings.baseRecepcion)}</b>; base de despacho: <b>${esc(S.settings.baseDespacho)}</b>). Stock físico = última varillaje convertida con el aforo del tanque. Nunca se mezclan. Gal totales en tanque (incluye fondo muerto).</div>
 <div class="tblw"><table><thead><tr><th>Producto</th><th>Tanque</th><th class="n">Capacidad</th><th class="n">Stock inicial</th><th class="n">Recepciones</th><th class="n">Despachos</th><th class="n">Trasv./ajustes</th><th class="n">Stock teórico</th><th class="n">Stock físico</th><th class="n">Útil</th><th>Lectura</th><th class="n">Dif. gl</th><th class="n">Dif. %</th><th>Estado</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="click" onclick="go('stock',{tank:'${r.t.id}'})" ${r.t.id===sel?'style="background:var(--soft)"':''}><td>${esc(r.t.producto)}</td><td><b>${esc(r.t.id)}</b></td><td class="n">${fmt(r.t.cap)}</td><td class="n">${r.saldo==null?'<span class="pend">sin saldo</span>':fmt(r.saldo)}</td><td class="n">${fmt(r.rec)}</td><td class="n">${fmt(r.des)}</td><td class="n">${fmt(r.otr)}</td><td class="n">${fmt(r.th)}</td><td class="n">${r.ph?fmt(r.ph.m.gal):'—'}</td><td class="n">${r.ph?fmt(Math.max(0,r.ph.m.gal-fmGal(r.t))):'—'}</td><td>${r.ph?new Date(r.ph.ts).toLocaleDateString('es-EC',{day:'2-digit',month:'2-digit'}):'—'}</td><td class="n">${fmt(r.d)}</td><td class="n">${r.p==null?'—':fmt(r.p,2)+' %'}</td><td>${SEM[r.s]}</td></tr>`).join('')}</tbody></table></div>
 <p class="small mut">Toque una fila para ver su historial. ${rows.some(r=>r.saldo==null)?'Los tanques "sin saldo" necesitan un saldo inicial: haga un varillaje y márquelo como saldo inicial (Supervisor).':''}</p>
 ${charts(sel)}`}
function lineSvg(series,w=340,h=170,fmtY=v=>fmt(v)){const pts=series.flatMap(s=>s.pts);if(pts.length<1)return'<div class="note">Aún no hay datos para graficar.</div>';
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x1===x0)x1=x0+864e5;if(y1===y0){y1+=1;y0-=1}
 const L=44,R=8,T=8,B=20;const X=x=>L+(x-x0)/(x1-x0)*(w-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(h-T-B);
 const dt=x=>new Date(x).toLocaleDateString('es-EC',{day:'2-digit',month:'short'});
 return`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><line x1="${L}" y1="${T}" x2="${L}" y2="${h-B}" stroke="var(--line)"/><line x1="${L}" y1="${h-B}" x2="${w-R}" y2="${h-B}" stroke="var(--line)"/>
 <text x="${L-4}" y="${T+8}" text-anchor="end">${fmtY(y1)}</text><text x="${L-4}" y="${h-B}" text-anchor="end">${fmtY(y0)}</text><text x="${L}" y="${h-4}">${dt(x0)}</text><text x="${w-R}" y="${h-4}" text-anchor="end">${dt(x1)}</text>
 ${series.map(s=>{const st=s.step;let d='';s.pts.forEach((p,i)=>{if(i===0)d+=`M${X(p[0])},${Y(p[1])}`;else d+=st?`H${X(p[0])}V${Y(p[1])}`:`L${X(p[0])},${Y(p[1])}`});return`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2"/>${s.dots?s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.c}"/>`).join(''):''}`}).join('')}</svg>
 <div class="row small">${series.map(s=>`<span><i style="display:inline-block;width:12px;height:3px;background:${s.c};vertical-align:middle"></i> ${s.n}</span>`).join('')}</div>`}
function charts(id){const t=tk(id);const ev=evs(id).filter(e=>t.saldoW==null||e.w>=t.saldoW);const rd=rds(id);
 const sT=[];if(t.saldo!=null){let g=t.saldo;sT.push([t.saldoW,g]);ev.forEach(e=>{g+=e.g;sT.push([e.w,g])})}
 const sF=rd.map(r=>[r.ts,r.m.gal]);
 const dif=[];if(t.saldo!=null){rd.forEach(r=>{const th=theo(id,r.ts);if(th!=null)dif.push([r.ts,r.m.gal-th])})}
 let acc=0;const va=[];ev.forEach(e=>{const o=e.o;let d=null;if(o.tipo==='REC'&&A_(o)!=null)d=sub(C_(o),A_(o));else if(o.tipo==='DES'&&(o.f.docVol!=null))d=sub(o.f.docVol,T_(o));if(d!=null){acc+=d;va.push([e.w,acc])}});
 const days={};ev.forEach(e=>{const k=new Date(e.w).toISOString().slice(0,10);days[k]=days[k]||{r:0,d:0};if(e.k==='REC')days[k].r+=e.g;if(e.k==='DES')days[k].d+=-e.g});
 const dk=Object.keys(days).sort().slice(-14);const mx=Math.max(1,...dk.map(k=>Math.max(days[k].r,days[k].d)));
 const bw=340/(Math.max(1,dk.length)*2+1);
 const bars=dk.length?`<svg class="chart" viewBox="0 0 340 150">${dk.map((k,i)=>{const x=bw*(1+i*2)-bw*.0;const hr=days[k].r/mx*110,hd=days[k].d/mx*110;return`<rect x="${x-bw*.45}" y="${130-hr}" width="${bw*.9}" height="${hr}" fill="var(--c1)"/><rect x="${x+bw*.55}" y="${130-hd}" width="${bw*.9}" height="${hd}" fill="var(--c2)"/><text x="${x+bw*.5}" y="144" text-anchor="middle">${k.slice(8)}/${k.slice(5,7)}</text>`}).join('')}</svg><div class="row small"><span><i style="display:inline-block;width:12px;height:8px;background:var(--c1)"></i> Recepciones</span><span><i style="display:inline-block;width:12px;height:8px;background:var(--c2)"></i> Despachos</span></div>`:'<div class="note">Aún no hay recepciones ni despachos cerrados.</div>';
 return`<h2>${esc(t.id)} · historial</h2><div class="grid2"><div class="card"><h3>Stock teórico y físico (gl)</h3>${lineSvg([{n:'Teórico',c:'var(--c1)',pts:sT,step:true},{n:'Físico (varillaje)',c:'var(--c2)',pts:sF,dots:true}])}</div>
 <div class="card"><h3>Recepciones y despachos por día (gl)</h3>${bars}</div>
 <div class="card"><h3>Diferencia físico − teórico (gl)</h3>${lineSvg([{n:'Diferencia',c:'var(--c3)',pts:dif,dots:true}])}</div>
 <div class="card"><h3>Variación acumulada de operaciones (gl)</h3>${lineSvg([{n:'Físico − documento',c:'var(--c2)',pts:va,dots:true}])}</div></div>`}

const sel=(p,val,opts,ph)=>`<select data-p="${p}"><option value="">${ph||'Seleccione…'}</option>${opts.map(o=>{const v=typeof o==='string'?o:o[0],l=typeof o==='string'?o:o[1];return`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const inp=(p,val,ty,ex)=>`<input data-p="${p}" ${ty==='n'?'type="number" inputmode="decimal" step="any" data-t="n"':ty?`type="${ty}"`:'type="text"'} value="${esc(val==null?'':val)}" ${ex||''}>`;
const fld=(l,h,hint)=>`<label class="fld"><span>${l}</span>${h}${hint?`<small>${hint}</small>`:''}</label>`;
function setPath(root,path,v){const ks=path.split('.');let r=root;for(let i=0;i<ks.length-1;i++)r=r[ks[i]];const k=ks[ks.length-1];const old=r[k];r[k]=v;return old}
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.ph){const f=t.files&&t.files[0];t.value='';if(f)await addPhoto(f,t.dataset.ph,t.dataset.src);return}
 if(t.dataset.m){const [s,fl]=t.dataset.m.split(':');const o=CUR;let v=t.value;if(['mm','gal','temp'].includes(fl))v=v===''?null:Number(v);if(t.type==='checkbox')v=t.checked;commitMeasure(o,s,fl,v);save();render();return}
 if(t.dataset.p&&CUR&&V.s==='wiz'){let v=t.value;if(t.dataset.t==='n')v=v===''?null:Number(v);if(t.type==='checkbox')v=t.checked;setPath(CUR,t.dataset.p,v);afterField(t.dataset.p);save();render();return}
 if(t.dataset.p&&V.s==='var'){return}
 if(t.dataset.s){let v=t.value;if(t.dataset.t==='n')v=v===''?null:Number(v);if(t.type==='checkbox')v=t.checked;if(t.dataset.t==='b')v=v==='true';
  if(t.dataset.t==='tabla'){const pts=v.split(/\n/).map(l=>l.trim().split(/[;,\s\t]+/).map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])&&!isNaN(a[1])).sort((a,b)=>a[0]-b[0]);v=pts.length>1?pts:null;setPath(S,t.dataset.s,v);audit('config',t.dataset.s,(v?v.length:0)+' puntos');save();render();return}
  const old=setPath(S,t.dataset.s,v);audit('config',t.dataset.s,String(old)+' → '+String(v));save();render();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m&&t.dataset.m.endsWith(':mm')&&CUR){const s=t.dataset.m.split(':')[0];const v=t.value===''?null:Number(t.value);const g=calcGal(CUR,s,v);const el=document.getElementById('pv-'+s);if(el)el.textContent=g==null?'—':fmt(g)+' gl'}});
function recalcAll(o){for(const s of Object.keys(o.m)){const m=o.m[s];if(m&&m.mm!=null){const d=FLOW[o.tipo].slots[s];const g=calcGal(o,s,m.mm);if(d.k==='tk'||g!=null){m.gal=g;m.manual=false}}}}
function afterField(p){const o=CUR;if(p==='f.tank'&&(o.tipo==='REC'||o.tipo==='DES')){const t0=tk(o.f.tank);o.f.producto=t0?t0.producto:''}if(p==='f.tank'||p==='f.tank2'||p==='f.placa')recalcAll(o);if(p==='f.placa'){const q=tq(o.f.placa);if(q&&!o.f.conductor)o.f.conductor=q.conductor}
 }

/* ============ mediciones ============ */
function entityOf(o,slot){const d=FLOW[o.tipo].slots[slot];return d.k==='tk'?tk(o.f[d.t]):tq(o.f.placa)}
function calcGal(o,slot,mm){const d=FLOW[o.tipo].slots[slot];if(mm==null||isNaN(mm))return null;
 if(d.k==='tk')return vol(tk(o.f[d.t]),mm);const q=tq(o.f.placa);if(q&&q.tabla&&q.tabla.length>1)return interp(q.tabla,mm);return null}
function commitMeasure(o,slot,field,v){const m=o.m[slot]=o.m[slot]||{hora:hhmm(),user:uname(),ts:nowISO()};
 if(field==='mm'){m.mm=v;m.capOk=false;const g=calcGal(o,slot,v);const d=FLOW[o.tipo].slots[slot];if(d.k==='tq'&&g==null){m.manual=true}else{m.manual=false;m.gal=g}}
 else if(field==='gal'){m.gal=v;m.manual=true}
 else m[field]=v;
 audit('medición',o.id,slot+' '+field+'='+v)}
function measureBlock(o,slot,extra){const d=FLOW[o.tipo].slots[slot];
 if(d.k==='ph'){const m=o.m[slot]||{};return`<div class="card"><h3>📷 ${esc(d.l)}</h3><div class="small mut">Tome la foto con la boca de carga abierta y el interior visible.</div>${photoBlock(o,slot)}</div>`}
 if(d.k==='tq'&&!tqOn(o))return`<div class="note"><b>${esc(d.l)}</b><br>Este tanquero no tiene varilla: no se mide. El volumen del tanquero queda sin dato y la conciliación usa documento y tanque.</div>`;const m=o.m[slot]||{};const ent=entityOf(o,slot);const ro=false;let head='',warn='';
 if(d.k==='tk'){if(!ent)return`<div class="err">Seleccione el tanque en el paso 1.</div>`;head=`<div class="kv"><b>Tanque</b><span>${esc(ent.id)} · ${esc(ent.producto)}</span><b>Capacidad</b><span>${fmt(ent.cap)} gl</span><b>Aforo</b><span>${esc(metodoTxt(ent))}</span></div>`;
  if(ent.modelo==='tabla'&&m.mm!=null&&m.gal==null)warn='<div class="err">La lectura está fuera del rango de la tabla de aforo.</div>';if(m.gal!=null&&m.gal>ent.cap)warn+=`<div class="err"><b>Atención:</b> ${fmt(m.gal)} gl supera la capacidad nominal (${fmt(ent.cap)} gl).<label class="row" style="margin-top:6px"><input type="checkbox" data-m="${slot}:capOk" ${m.capOk?'checked':''}> Confirmo que la lectura es correcta (queda registrada)</label></div>`}
 else{head=`<div class="kv"><b>Tanquero</b><span>${esc(o.f.placa||'—')} · ${esc(o.f.conductor||'')}</span><b>Aforo</b><span>${ent&&ent.tabla?'Tabla del tanquero ('+ent.tabla.length+' puntos), interpolación lineal':`<span class="pend">${PEND}</span>: sin tabla de aforo del tanquero; ingrese los galones leídos en su tabla (registro manual)`}</span></div>`}
 return`<div class="card"><h3>${esc(d.l)}</h3>${head}${warn}
 <div class="grid2">${fld('Lectura (mm)',`<input type="number" inputmode="decimal" step="any" data-m="${slot}:mm" value="${m.mm==null?'':m.mm}">`)}
 ${fld('Hora de la lectura',`<input type="time" data-m="${slot}:hora" value="${esc(m.hora||'')}">`)}</div>
 <div class="row"><span class="mut">Volumen:</span> <span class="big" id="pv-${slot}">${m.gal==null?'—':fmt(m.gal)+' gl'}</span>${m.manual&&d.k==='tq'?'<span class="badge warn">manual</span>':''}</div>
 ${(d.k==='tq'&&(m.manual||!ent||!ent.tabla))?fld('Galones según tabla del tanquero (manual)',`<input type="number" inputmode="decimal" step="any" data-m="${slot}:gal" value="${m.gal==null?'':m.gal}">`):''}
 ${fld('Temperatura (°C)'+(S.settings.tempRequired?' *':' — si aplica'),`<input type="number" inputmode="decimal" step="any" data-m="${slot}:temp" value="${m.temp==null?'':m.temp}">`)}
 <h3>📷 Foto de la medición</h3><div class="small mut">Muestre la varilla/regla con la lectura visible y use buena luz o flash. La foto lleva operación, hora y usuario.</div>${photoBlock(o,slot)}${extra||''}</div>`}
function vm(o,slot){const d=FLOW[o.tipo].slots[slot];const m=o.m[slot];const e=[];const l=d.l;
 if(d.k==='ph')return(m&&m.fotoId)?[]:[`${l}: falta la foto obligatoria.`];
 if(d.k==='tq'&&!tqOn(o))return[];if(!m||m.mm==null)return[`${l}: falta la lectura.`];
 if(m.mm<0)e.push(`${l}: lectura negativa.`);if(m.gal==null)e.push(`${l}: falta el volumen (fuera de la tabla de aforo o sin galones manuales).`);
 if(d.k==='tk'){const t0=tk(o.f[d.t]);if(t0&&!t0.diam&&!(t0.tabla&&t0.tabla.length>1))e.push(`${l}: el tanque ${t0.id} no tiene aforo definido (diámetro o tabla en Datos maestros).`)}
 if(d.k==='tk'){const t=tk(o.f[d.t]);if(t&&m.gal!=null&&m.gal>t.cap&&!m.capOk)e.push(`${l}: ${fmt(m.gal)} gl supera la capacidad nominal (${fmt(t.cap)} gl). Revise la lectura o marque la casilla de confirmación.`)}
 if(S.settings.tempRequired&&m.temp==null)e.push(`${l}: falta la temperatura.`);
 if(!m.fotoId)e.push(`${l}: falta la foto obligatoria.`);else if(m.fotoMm!==m.mm)e.push(`${l}: la lectura cambió después de la foto; tome la foto otra vez.`);
 return e}

function commonId(o){const e=[];const f=o.f;if(!f.fecha)e.push('Falta la fecha.');else if(f.fecha>today())e.push('La fecha no puede ser futura.');if(!f.horaIni)e.push('Falta la hora.');if(f.horaFin&&f.fecha&&f.horaIni&&f.horaFin<f.horaIni)e.push('La hora final es anterior a la inicial.');if(!f.operador)e.push('Falta el operador responsable.');return e}
function opts(o){return{prods:S.productos,users:S.users.map(u=>u.name)}}
function datalist(id,arr){return`<datalist id="${id}">${arr.map(a=>`<option value="${esc(typeof a==='string'?a:a.placa)}">`).join('')}</datalist>`}

 return`<div class="card"><h3>Datos de la recepción</h3>${datalist('dlP',S.proveedores)}${datalist('dlT',S.tanqueros)}
 <div class="grid2">${fld('Fecha',inp('f.fecha',f.fecha,'date'))}${fld('Hora de inicio',inp('f.horaIni',f.horaIni,'time'))}</div>
 ${fld('Proveedor',inp('f.proveedor',f.proveedor,'',`list="dlP"`))}
 ${fld('Producto (según el tanque)',`<input value="${esc(f.producto||'')}" readonly placeholder="Se completa al elegir el tanque">`)}
 <div class="grid2">${fld('Documento / guía de remisión',inp('f.doc',f.doc))}${fld('Cantidad según documento (gl)',inp('f.docVol',f.docVol,'n'))}</div>
 <div class="grid2">${fld('Placa del tanquero',inp('f.placa',f.placa,'',`list="dlT" autocapitalize="characters"`))}${fld('Conductor',inp('f.conductor',f.conductor))}</div>
 ${tqChk(o)}${fld('Tanque receptor',sel('f.tank',f.tank,tanks),'Tanques marcados como "recibe de proveedores" (Datos maestros). El producto se completa solo.')}
 ${fld('Operador responsable',sel('f.operador',f.operador,S.users.map(u=>u.name)))}</div>`}
function vidREC(o){const f=o.f,e=commonId(o);if(!f.proveedor)e.push('Falta el proveedor.');if(!f.producto)e.push('Falta el producto.');if(!f.doc)e.push('Falta el documento / guía.');if(!(f.docVol>0))e.push('La cantidad documental debe ser mayor a 0.');if(!f.placa)e.push('Falta la placa del tanquero.');if(!f.conductor)e.push('Falta el conductor.');
 if(!f.tank)e.push('Seleccione el tanque receptor.');else{const t=tk(f.tank);if(t&&f.producto&&t.producto!==f.producto)e.push(`Producto incompatible: el tanque ${t.id} contiene "${t.producto}".`)}
 if(f.doc){const d=S.ops.find(x=>x.id!==o.id&&x.tipo==='REC'&&x.estado!=='anulada'&&String(x.f.doc).trim().toLowerCase()===String(f.doc).trim().toLowerCase()&&String(x.f.proveedor).trim().toLowerCase()===String(f.proveedor).trim().toLowerCase());if(d)e.push(`Documento duplicado: ya registrado en ${d.id}.`)}
 return e}
function idDES(o){const f=o.f;let tl=S.tanks.filter(t=>t.estado==='Activo'&&t.despacha);if(!tl.length)tl=S.tanks.filter(t=>t.estado==='Activo');const tanks=tl.map(t=>[t.id,t.id+' · '+t.nombre]);
 return`<div class="card"><h3>Datos del despacho</h3>${datalist('dlC',S.clientes)}${datalist('dlT',S.tanqueros)}
 <div class="grid2">${fld('Fecha',inp('f.fecha',f.fecha,'date'))}${fld('Hora',inp('f.horaIni',f.horaIni,'time'))}</div>
 ${fld('Cliente',inp('f.cliente',f.cliente,'',`list="dlC"`))}${fld('Producto (según el tanque)',`<input value="${esc(f.producto||'')}" readonly placeholder="Se completa al elegir el tanque">`)}
 ${tqChk(o)}${fld('Tanque de origen',sel('f.tank',f.tank,tanks),'Tanques marcados como "despacha a clientes" (Datos maestros). El producto se completa solo.')}
 <div class="grid2">${fld('Placa del tanquero',inp('f.placa',f.placa,'',`list="dlT" autocapitalize="characters"`))}${fld('Conductor',inp('f.conductor',f.conductor))}</div>
 <div class="grid3">${fld('Documento',inp('f.doc',f.doc))}${fld('Cantidad según documento (gl)',inp('f.docVol',f.docVol,'n'))}${fld('Cantidad solicitada (gl)',inp('f.solicitado',f.solicitado,'n'))}</div>
 ${fld('Operador responsable',sel('f.operador',f.operador,S.users.map(u=>u.name)))}</div>`}
function vidDES(o){const f=o.f,e=commonId(o);if(!f.cliente)e.push('Falta el cliente.');if(!f.producto)e.push('Falta el producto.');if(!f.tank)e.push('Seleccione el tanque de origen.');else{const t=tk(f.tank);if(t&&f.producto&&t.producto!==f.producto)e.push(`Producto incompatible con ${t.id}.`)}
 if(!f.placa)e.push('Falta la placa.');if(!f.conductor)e.push('Falta el conductor.');if(!f.doc)e.push('Falta el documento.');if(!(f.solicitado>0))e.push('La cantidad solicitada debe ser mayor a 0.');
 if(f.doc){const d=S.ops.find(x=>x.id!==o.id&&x.tipo==='DES'&&x.estado!=='anulada'&&String(x.f.doc).trim().toLowerCase()===String(f.doc).trim().toLowerCase());if(d)e.push(`Documento duplicado: ya registrado en ${d.id}.`)}return e}
function idTRV(o){const f=o.f;const tanks=S.tanks.filter(t=>t.estado==='Activo').map(t=>[t.id,t.id+' · '+t.nombre]);const a=tk(f.tank),b=tk(f.tank2);
 return`<div class="card"><h3>Datos del trasvase / producción</h3><div class="grid2">${fld('Fecha',inp('f.fecha',f.fecha,'date'))}${fld('Hora',inp('f.horaIni',f.horaIni,'time'))}</div>
 ${fld('Tipo',sel('f.subtipo',f.subtipo,['Trasvase','Producción','Reproceso']))}${fld('Tanque de origen',sel('f.tank',f.tank,tanks))}${fld('Tanque de destino',sel('f.tank2',f.tank2,tanks))}
 ${a&&b&&a.producto!==b.producto&&f.subtipo==='Trasvase'?`<div class="note"><span class="pend">Productos distintos:</span> ${esc(a.producto)} → ${esc(b.producto)}.<label class="row" style="margin-top:6px"><input type="checkbox" data-p="f.cambioProducto" ${f.cambioProducto?'checked':''}> Confirmo que este trasvase es correcto (si es una transformación, elija "Producción")</label></div>`:''}
 ${fld('Motivo / observación',inp('f.obs',f.obs))}${fld('Operador responsable',sel('f.operador',f.operador,S.users.map(u=>u.name)))}</div>`}
function vidTRV(o){const f=o.f,e=commonId(o);if(!f.tank)e.push('Seleccione el origen.');if(!f.tank2)e.push('Seleccione el destino.');if(f.tank&&f.tank===f.tank2)e.push('Origen y destino no pueden ser el mismo tanque.');
 const a=tk(f.tank),b=tk(f.tank2);if(a&&b&&a.producto!==b.producto&&f.subtipo==='Trasvase'&&!f.cambioProducto)e.push('Productos distintos en un trasvase: confirme con la casilla o cambie el tipo a Producción.');return e}
function stockBox(o,id){const t=tk(id);if(!t)return'';const th=theo(id),ph=phys(id);const d=(th!=null&&ph)?ph.m.gal-th:null;
 return`<div class="note"><b>Antes de empezar · ${esc(t.id)}</b><div class="kv"><b>Stock teórico</b><span>${th==null?'<span class="pend">sin saldo inicial</span>':fmt(th)+' gl'}</span><b>Último físico</b><span>${ph?fmt(ph.m.gal)+' gl ('+fts(new Date(ph.ts))+')':'—'}</span><b>Diferencia</b><span>${d==null?'—':fmt(d)+' gl ('+fmt(pc(d,th),2)+' %)'}</span></div></div>`}

 {t:'Tanquero · medición final',r:o=>measureBlock(o,'tqFin')+calcBox(o,[['Entregado por el tanquero (B)',B_(o)]]),v:o=>{const e=vm(o,'tqFin');const b=B_(o);if(b!=null&&b<0)e.push('El tanquero terminó con más volumen que al inicio.');return e}},
 {t:'Tanque receptor · medición final',r:o=>`<div class="note small">Espere el tiempo de estabilización definido por el procedimiento: <span class="pend">${S.settings.estabMin==null?PEND:S.settings.estabMin+' min'}</span>.</div>`+fld('Minutos de estabilización transcurridos',inp('f.estabMin',o.f.estabMin,'n'))+measureBlock(o,'tkFin')+calcBox(o,[['Recibido en el tanque (C)',C_(o)]]),v:o=>{const e=vm(o,'tkFin');const c=C_(o);if(c!=null&&c<0)e.push('El tanque receptor terminó con menos volumen que al inicio.');if(S.settings.estabMin!=null&&!(o.f.estabMin>=S.settings.estabMin))e.push(`Estabilización insuficiente (mínimo ${S.settings.estabMin} min).`);return e}},
 {t:'Conciliación',r:stepConc,v:vConc},
 {t:'Firma y cierre',r:stepSign,v:vSign}],
DES:[
 {t:'Identificación',r:idDES,v:vidDES},
 {t:'Tanque de origen · medición inicial',r:o=>stockBox(o,o.f.tank)+measureBlock(o,'tkIni'),v:o=>{const e=vm(o,'tkIni');const g=G(o,'tkIni');if(g!=null&&o.f.solicitado>g)e.push(`Despacho superior al stock disponible: solicitado ${fmt(o.f.solicitado)} gl, en el tanque ${fmt(g)} gl.`);return e}},
 {t:'Tanquero vacío y medición inicial',r:o=>measureBlock(o,'vacio')+measureBlock(o,'tqIni'),v:o=>vm(o,'vacio').concat(vm(o,'tqIni'))},
 {t:'Carga',r:stepDesc,v:o=>{const e=[];if((tqOn(o)&&!o.m.tqIni)||!o.m.tkIni||!o.m.vacio)e.push('Complete las mediciones y la foto del tanquero vacío antes de cargar.');if(!o.f.horaFin){o.f.horaFin=hhmm();toast('Fin de carga marcado: '+o.f.horaFin)}return e}},
 {t:'Tanque de origen · medición final',r:o=>measureBlock(o,'tkFin')+calcBox(o,[['Producto despachado (disminución del tanque)',T_(o)]]),v:o=>{const e=vm(o,'tkFin');const t=T_(o);if(t!=null&&t<0)e.push('El tanque terminó con más volumen que al inicio.');return e}},
 {t:'Tanquero · medición final',r:o=>measureBlock(o,'tqFin')+calcBox(o,[['Cargado al tanquero',B_(o)]]),v:o=>{const e=vm(o,'tqFin');const q=B_(o);if(q!=null&&q<0)e.push('El tanquero terminó con menos volumen que al inicio.');return e}},
 {t:'Conciliación',r:stepConc,v:vConc},
 {t:'Firma y cierre',r:stepSign,v:vSign}],
TRV:[
 {t:'Identificación',r:idTRV,v:vidTRV},

 {t:'Destino · medición inicial',r:o=>stockBox(o,o.f.tank2)+measureBlock(o,'dIni')+capWarn(o,'dIni'),v:o=>vm(o,'dIni')},
 {t:'Operación',r:stepDesc,v:o=>{const e=[];if(!o.f.horaFin){o.f.horaFin=hhmm();toast('Fin de la operación marcado: '+o.f.horaFin)}return e}},
 {t:'Origen · medición final',r:o=>measureBlock(o,'oFin')+calcBox(o,[['Salida del origen',sub(G(o,'oIni'),G(o,'oFin'))]]),v:o=>{const e=vm(o,'oFin');const s=sub(G(o,'oIni'),G(o,'oFin'));if(s!=null&&s<0)e.push('El origen terminó con más volumen que al inicio.');return e}},
 {t:'Destino · medición final',r:o=>measureBlock(o,'dFin')+calcBox(o,[['Entrada al destino',sub(G(o,'dFin'),G(o,'dIni'))]]),v:o=>{const e=vm(o,'dFin');const s=sub(G(o,'dFin'),G(o,'dIni'));if(s!=null&&s<0)e.push('El destino terminó con menos volumen que al inicio.');return e}},
 {t:'Conciliación',r:stepConc,v:vConc},

};
function capWarn(o,slot){const s=slot||'tkIni';const m=o.m[s];const d=FLOW[o.tipo].slots[s];const t=tk(o.f[d.t]);if(!m||m.gal==null||!t)return'';const add=o.tipo==='REC'?o.f.docVol:0;if(add&&m.gal+add>t.cap)return`<div class="err"><b>Atención:</b> ${fmt(m.gal)} gl + ${fmt(add)} gl del documento superan la capacidad nominal de ${fmt(t.cap)} gl.</div>`;return''}
function calcBox(o,rows){return`<div class="card okc">${rows.map(r=>`<div class="row" style="justify-content:space-between"><span>${r[0]}</span><span class="big">${fmt(r[1])} gl</span></div>`).join('')}</div>`}
function stepDesc(o){const lbl=o.tipo==='REC'?'descarga':o.tipo==='DES'?'carga':'operación';
 return`<div class="card"><h3>${lbl[0].toUpperCase()+lbl.slice(1)}</h3><div class="note small">Solo abra válvulas después de tener las mediciones y fotos iniciales.</div>
 <div class="row"><div class="kv"><b>Inicio</b><span>${esc(o.f.horaIni)}</span><b>Fin</b><span>${esc(o.f.horaFin||'—')}</span></div><button class="btn pri" onclick="markFin()">⏱ Marcar fin de ${lbl}</button></div>
 ${fld('Observaciones',`<textarea data-p="f.obs">${esc(o.f.obs)}</textarea>`)}</div>`}
function markFin(){CUR.f.horaFin=hhmm();audit('fin operación',CUR.id,CUR.f.horaFin);save();render()}
function stepConc(o){const c=conc(o);const sm=c.sem;const rd=sm==='red';
 return`<div class="card ${rd?'alert':''}"><h3>Volúmenes</h3><div class="tblw"><table><tbody>${c.items.map(i=>`<tr><td>${i[0]}</td><td class="n"><b>${fmt(i[1])}</b> gl</td></tr>`).join('')}</tbody></table></div>
 <h3>Diferencias</h3><div class="tblw"><table><thead><tr><th>Comparación</th><th class="n">gl</th><th class="n">%</th><th>Estado</th></tr></thead><tbody>${c.diffs.map(d=>`<tr><td>${d.n}</td><td class="n">${fmt(d.g)}</td><td class="n">${d.p==null?'—':fmt(d.p,2)+' %'}</td><td>${SEM[sem(d.p)]}</td></tr>`).join('')}</tbody></table></div>
 <p>${badge(sm)}</p>${sm==='pend'?`<div class="note"><span class="pend">${PEND}:</span> defina las tolerancias en Datos maestros para activar el semáforo y las alertas.</div>`:''}
 ${rd?`<div class="err"><b>🔴 ALERTA DE DIFERENCIA</b><br>Complete observación, responsable y acción tomada.</div>`:''}
 ${fld('Observación'+(rd?' *':''),`<textarea data-p="conc.obs">${esc(o.conc.obs)}</textarea>`)}
 <div class="grid2">${fld('Responsable'+(rd?' *':''),inp('conc.responsable',o.conc.responsable))}${fld('Acción tomada'+(rd?' *':''),inp('conc.accion',o.conc.accion))}</div>
 ${rd?`<h3>Evidencia adicional (opcional)</h3><div class="small mut">Adjunte la foto desde el celular o tome una nueva.</div><div class="ph"><div>${o.conc.ev?`<img data-pid="${o.conc.ev}" alt="Evidencia adicional" onclick="viewImg(this.src)">`:''}</div><div class="acts"><label class="btn">📷 Foto de evidencia<input type="file" accept="image/*" capture="environment" hidden data-evid="1"></label></div></div>`:''}</div>`}
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.evid&&t.files[0]){const f=t.files[0];t.value='';const id='PH-'+CUR.id+'-ev-'+Date.now();await IDB.put('photos',id,{blob:f,meta:{ts:nowISO(),user:uname(),op:CUR.id,slot:'evidencia',origen:'adjunto',archivo:f.name,tamanoOriginal:f.size}});CUR.conc.ev=id;audit('foto evidencia',CUR.id,'');save();render()}});
function vConc(o){const e=[];const c=conc(o);if(!c.diffs.length)e.push('No hay datos para conciliar.');if(c.sem==='red'){if(!o.conc.obs.trim())e.push('Falta la observación de la diferencia.');if(!o.conc.responsable.trim())e.push('Falta el responsable.');if(!o.conc.accion.trim())e.push('Falta la acción tomada.')}return e}
function stepSign(o){const roles=[['operador','Operador'],['conductor','Conductor'],['supervisor','Supervisor']];
 return`<div class="card"><h3>Firmas</h3><div class="small mut">Firme con el dedo o el mouse. La firma del operador es obligatoria${conc(o).sem==='red'?'; con alerta roja también la del supervisor':''}.</div>
 ${roles.map(r=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b>${r[1]}</b><button class="btn sm" onclick="clearSig('${r[0]}')">Limpiar</button></div><canvas class="sig" data-sig="${r[0]}" width="600" height="240"></canvas></div>`).join('')}</div>
 <div class="note small">Al cerrar, la operación queda bloqueada. Cualquier corrección posterior requiere un Supervisor, un motivo y deja historial.</div>`}
function vSign(o){const e=[];if(!o.firmas.operador)e.push('Falta la firma del operador.');if(conc(o).sem==='red'&&!o.firmas.supervisor)e.push('Con alerta roja se requiere la firma del supervisor.');return e}
/* firmas */
function initSigs(){document.querySelectorAll('canvas.sig').forEach(c=>{const role=c.dataset.sig;const x=c.getContext('2d');x.lineWidth=3;x.lineCap='round';x.strokeStyle='#111';
 const saved=CUR&&CUR.firmas&&CUR.firmas[role];if(saved){const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=saved}
 let dr=false;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);const p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);e.preventDefault()};
 c.onpointermove=e=>{if(!dr)return;const p=pos(e);x.lineTo(p[0],p[1]);x.stroke()};
 c.onpointerup=()=>{if(!dr)return;dr=false;CUR.firmas[role]=c.toDataURL('image/png');save()}})}
function clearSig(r){const c=document.querySelector(`canvas[data-sig="${r}"]`);c.getContext('2d').clearRect(0,0,c.width,c.height);delete CUR.firmas[r];save()}

/* ============ asistente ============ */
function rWiz(){const o=CUR=opById(V.p.id);const st=STEPS[o.tipo];const i=o.step;const ro=o.estado!=='en_curso';if(ro){return rActa(o)}
 const locked=o.estado==='en_curso';
 const bar=`<div class="prog">${st.map((s,k)=>`<i class="${k<i?'d':k===i?'c':''}"></i>`).join('')}</div>`;
 const last=i===st.length-1;
 $('#navbar').innerHTML=`<div class="nav"><button class="btn" ${i===0?'disabled':''} onclick="stepTo(${i-1})">← Anterior</button>${last?`<button class="btn pri" onclick="closeOp()">✔ Cerrar operación</button>`:`<button class="btn pri" onclick="stepNext()">Siguiente →</button>`}</div>`;
 return`<div class="row">${back()}<span class="mut small">${esc(o.id)} · ${esc(FLOW[o.tipo].n)}</span></div>${bar}<h1>Paso ${i+1} de ${st.length} · ${esc(st[i].t)}</h1>
 ${ERR.length?`<div class="err"><b>Revise antes de continuar:</b><ul>${ERR.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}${st[i].r(o)}`}
function stepTo(n){CUR.step=n;ERR=[];save();window.scrollTo(0,0);render()}
function stepNext(){const o=CUR;ERR=STEPS[o.tipo][o.step].v(o);if(ERR.length){render();window.scrollTo(0,0);return}stepTo(o.step+1)}
function closeOp(){const o=CUR;let all=[];STEPS[o.tipo].forEach((s,k)=>{const e=s.v(o);e.forEach(x=>all.push(`Paso ${k+1}: ${x}`))});
 if(all.length){ERR=all;render();window.scrollTo(0,0);return}
 if(!o.f.horaFin)o.f.horaFin=hhmm();o.estado='cerrada';o.cerrado={ts:nowISO(),user:uname()};o.sum=summ(o);audit('cerrar',o.id,'sem='+o.sum.sem);sealOp(o);save();toast('Operación '+o.id+' cerrada');go('acta',{id:o.id})}

/* ============ varillaje (VAR) y ajuste (AJU) como asistentes cortos ============ */
STEPS.VAR=[{t:'Medición',r:o=>{const tanks=S.tanks.filter(t=>t.estado==='Activo').map(t=>[t.id,t.id+' · '+t.nombre]);
 return`<div class="card"><div class="grid2">${fld('Fecha',inp('f.fecha',o.f.fecha,'date'))}${fld('Tanque',sel('f.tank',o.f.tank,tanks))}</div>${fld('Operador',sel('f.operador',o.f.operador,S.users.map(u=>u.name)))}</div>`+(o.f.tank?stockBox(o,o.f.tank)+measureBlock(o,'r')+(isSup()?`<div class="card"><label class="row"><input type="checkbox" data-p="f.saldo" ${o.f.saldo?'checked':''}> Usar esta medición como <b>saldo inicial</b> del tanque (Supervisor)</label><div class="small mut">El stock teórico se calcula desde este saldo; los movimientos anteriores no cuentan.</div></div>`:''):'')},
 v:o=>{const e=commonId(o);if(!o.f.tank)e.push('Seleccione el tanque.');else e.push(...vm(o,'r'));if(o.f.saldo&&!isSup())e.push('Solo un Supervisor puede fijar el saldo inicial.');return e}},
 {t:'Firma y cierre',r:stepSign,v:vSign}];
FLOW.VAR.slots.r.t='tank';
STEPS.AJU=[{t:'Ajuste',r:o=>{const tanks=S.tanks.map(t=>[t.id,t.id+' · '+t.nombre]);return`<div class="card"><h3>Ajuste autorizado de stock teórico</h3><div class="note small">Corrige el stock teórico (no la varillaje). Requiere Supervisor, motivo y queda en el historial.</div>${fld('Fecha',inp('f.fecha',o.f.fecha,'date'))}${fld('Tanque',sel('f.tank',o.f.tank,tanks))}${fld('Galones (+ suma, − resta)',inp('f.gal',o.f.gal,'n'))}${fld('Motivo',inp('f.motivo',o.f.motivo))}${fld('Autorizado por',inp('f.autorizado',o.f.autorizado))}</div>`},
 v:o=>{const e=commonId(o);if(!isSup())e.push('Solo un Supervisor puede registrar ajustes.');if(!o.f.tank)e.push('Seleccione el tanque.');if(!o.f.gal)e.push('Ingrese los galones del ajuste.');if(!o.f.motivo)e.push('Falta el motivo.');if(!o.f.autorizado)e.push('Falta quién autoriza.');
  const t=tk(o.f.tank);if(t&&t.saldo==null)e.push('El tanque no tiene saldo inicial.');else if(t){const th=theo(t.id);if(th!=null&&th+Number(o.f.gal)<0)e.push('El ajuste dejaría el stock teórico negativo.')}return e}},
 {t:'Firma y cierre',r:stepSign,v:vSign}];

function recomputeSaldo(o){if(o.tipo==='VAR'&&o.f.saldo&&o.estado==='cerrada'){const t=tk(o.f.tank);t.saldo=G(o,'r');t.saldoW=whenOf(o);audit('saldo inicial',t.id,fmt(t.saldo)+' gl ('+o.id+')')}}
const _close=closeOp;closeOp=function(){const o=CUR;_close();if(o.estado==='cerrada')recomputeSaldo(o)};

/* ============ sello de integridad ============ */
function canon(o){return JSON.stringify({id:o.id,tipo:o.tipo,f:o.f,m:o.m,conc:o.conc,firmas:o.firmas,cerrado:o.cerrado})}
async function sealOp(o){const h=await sha256(new TextEncoder().encode(canon(o)));o.sello={hash:h,ts:nowISO()};save()}
async function verifySeal(o){const el=document.getElementById('seal');if(!el||!o||o.estado==='en_curso')return;if(!o.sello){el.textContent='Sin sello de integridad.';return}const h=await sha256(new TextEncoder().encode(canon(o)));el.innerHTML=h===o.sello.hash?`🔒 Registro cerrado y sellado (no modificable) · sello ${h.slice(0,16)}…`:'<b style="color:#B3261E">⚠ El contenido no coincide con el sello: el registro fue alterado</b>'}
/* ============ ACTA / detalle ============ */
function slotRows(o){const fl=FLOW[o.tipo].slots;return Object.keys(fl).map(s=>{const m=o.m[s];if(!m)return'';const d=fl[s];const ent=d.k==='tk'?o.f[d.t]:o.f.placa;return`<tr><td>${esc(fl[s].l)}</td><td>${esc(ent)}</td><td>${esc(o.f.fecha)} ${esc(m.hora||'')}</td><td class="n">${fmt(m.mm,1)}</td><td class="n">${fmt(m.gal)}</td><td>${m.temp==null?'—':m.temp+' °C'}${m.manual?' (manual)':''}</td></tr>`}).join('')}
function rActa(o){o=o||opById(V.p.id);CUR=o;if(!o)return back();const f=o.f,s=o.sum||summ(o),c=conc(o);const sup=isSup();
 const ph=Object.entries(o.m||{}).filter(([k,m])=>m&&m.fotoId).map(([k,m])=>`<figure style="margin:0"><img data-pid="${m.fotoId}" alt="${esc(FLOW[o.tipo].slots[k].l)}" onclick="viewImg(this.src)"><figcaption class="small">${esc(FLOW[o.tipo].slots[k].l)}</figcaption></figure>`).join('')+(o.conc.ev?`<figure style="margin:0"><img data-pid="${o.conc.ev}" alt="Evidencia" onclick="viewImg(this.src)"><figcaption class="small">Evidencia adicional</figcaption></figure>`:'');
 const id2=[['Fecha / hora',`${f.fecha} ${f.horaIni}${f.horaFin?' – '+f.horaFin:''}`],['Producto',f.producto||(tk(f.tank)||{}).producto],['Tanque',f.tank+(f.tank2?' → '+f.tank2:'')],['Tanquero / placa',f.placa?(f.placa+' · '+f.conductor):null],[o.tipo==='REC'?'Proveedor':'Cliente',f.proveedor||f.cliente],['Documento',f.doc],['Operador',f.operador],['Tipo',f.subtipo&&o.tipo==='TRV'?f.subtipo:null]].filter(r=>r[1]);
 $('#navbar').innerHTML='';
 return`<div class="row noprint">${back('hist')}<button class="btn sm pri" onclick="window.print()">🖨 Imprimir / guardar PDF</button>${o.estado==='cerrada'&&sup?`<button class="btn sm danger" onclick="voidOp('${o.id}')">Anular (con motivo)</button>`:''}</div>
 ${expRow('op:'+o.id)}<div class="acta"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><img src="${LOGO}" alt="LUBRIEC S.A." style="height:56px;width:auto;display:block"><div class="small">Acta digital de operación</div></div><div style="text-align:right"><b style="font-size:20px">${esc(o.id)}</b><br><span class="small">${esc(FLOW[o.tipo].n)} · ${esc(o.estado.replace('_',' '))}</span></div></div>

function dayRows(date){const st=new Date(date+'T00:00:00').getTime(),en=new Date(date+'T23:59:59').getTime();
 return S.tanks.filter(t=>t.estado==='Activo'&&t.saldo!=null).map(t=>{const ini=theo(t.id,st-1),fin=theo(t.id,en);const ev=evs(t.id).filter(e=>e.w>=st&&e.w<=en&&e.w>=t.saldoW);
  const rec=ev.filter(e=>e.k==='REC').reduce((a,e)=>a+e.g,0),des=-ev.filter(e=>e.k==='DES').reduce((a,e)=>a+e.g,0),otr=ev.filter(e=>e.k==='TRV'||e.k==='AJU').reduce((a,e)=>a+e.g,0);
  const ph=phys(t.id,en,st);const d=ph?ph.m.gal-fin:null;const p=pc(d,fin);const s=d==null?'na':sem(p);
  const est=s==='ok'?['🟢','Conforme']:s==='warn'?['🟡','Revisar']:s==='red'?['🔴','Investigar']:s==='pend'?['⚪','Tolerancia sin definir']:['🟡','Revisar: sin varillaje del día'];
  return{t,ini,rec,des,otr,fin,ph,d,p,est}})}

 return`${back()}<h1>Cierre diario de inventario</h1><div class="card"><div class="row">${fld('Fecha',`<input type="date" id="cdate" value="${date}" onchange="go('cierre',{date:this.value})">`)}</div></div>

 <div class="row" style="margin-top:12px"><button class="btn pri" onclick="confirmCierre('${date}')">🔒 Confirmar cierre del día</button>${cl?`<span class="badge ok">Cerrado ${fts(cl.ts)} por ${esc(cl.user)}</span>`:''}</div>`:'<div class="note">Ningún tanque tiene saldo inicial. Registre un varillaje como saldo inicial (Supervisor) para activar el cierre.</div>'}`}

function filtered(){const q=V.p;return S.ops.filter(o=>{const f=o.f;if(q.d1&&f.fecha<q.d1)return false;if(q.d2&&f.fecha>q.d2)return false;if(q.tipo&&o.tipo!==q.tipo)return false;if(q.tank&&f.tank!==q.tank&&f.tank2!==q.tank)return false;if(q.placa&&!String(f.placa).toUpperCase().includes(q.placa.toUpperCase()))return false;if(q.cond&&!String(f.conductor).toUpperCase().includes(q.cond.toUpperCase()))return false;if(q.ent&&!String(f.proveedor||f.cliente).toUpperCase().includes(q.ent.toUpperCase()))return false;if(q.prod&&f.producto!==q.prod&&(tk(f.tank)||{}).producto!==q.prod)return false;if(q.est&&o.estado!==q.est)return false;if(q.op&&!o.id.toUpperCase().includes(q.op.toUpperCase()))return false;if(q.sem&&(o.sum||summ(o)).sem!==q.sem)return false;return true})}
function repQ(k){return V.p[k]||''}

function rRep(){const list=filtered();const grp=V.p.grp||'';
 const g={};if(grp){list.filter(o=>o.estado==='cerrada').forEach(o=>{const f=o.f;const k=grp==='ent'?(f.proveedor||f.cliente||'—'):grp==='prod'?(f.producto||(tk(f.tank)||{}).producto||'—'):grp==='tank'?(f.tank||'—'):grp==='placa'?(f.placa||'—'):f.fecha;const s=o.sum||summ(o);g[k]=g[k]||{n:0,doc:0,tq:0,tk:0};g[k].n++;g[k].doc+=s.vDoc||0;g[k].tq+=s.vTq||0;g[k].tk+=s.vTk||0})}
 const inpq=(k,l,ty)=>fld(l,`<input ${ty?`type="${ty}"`:''} value="${esc(repQ(k))}" onchange="setQ('${k}',this.value)">`);
 const sq=(k,l,o)=>fld(l,`<select onchange="setQ('${k}',this.value)"><option value="">Todos</option>${o.map(x=>{const v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}" ${repQ(k)===v?'selected':''}>${esc(t)}</option>`}).join('')}</select>`);
 return`${back()}<h1>Reportes</h1><div class="card"><div class="grid3">${inpq('d1','Desde','date')}${inpq('d2','Hasta','date')}${sq('tipo','Tipo de movimiento',[['REC','Recepción'],['DES','Despacho'],['TRV','Trasvase / producción'],['VAR','Varillaje'],['AJU','Ajuste']])}${sq('tank','Tanque',S.tanks.map(t=>t.id))}${sq('prod','Producto',S.productos)}${sq('est','Estado',[['cerrada','Cerrada'],['en_curso','En curso'],['anulada','Anulada']])}${inpq('placa','Placa')}${inpq('cond','Conductor')}${inpq('ent','Cliente / proveedor')}${inpq('op','N.º de operación')}${sq('sem','Semáforo',[['ok','🟢 Dentro'],['warn','🟡 Advertencia'],['red','🔴 Fuera']])}${sq('grp','Agrupar por',[['ent','Cliente / proveedor'],['prod','Producto'],['tank','Tanque'],['placa','Tanquero'],['dia','Día']])}</div>
 <div class="row"><button class="btn" onclick="V.p={};render()">Limpiar filtros</button><button class="btn" onclick="window.print()">🖨 Imprimir</button><label class="btn">⬆ Importar JSON<input type="file" accept=".json,application/json" hidden onchange="importJSON(this)"></label></div></div>${expRow('rep',true)}
 ${grp?`<h2>Totales agrupados (solo operaciones cerradas)</h2><div class="tblw"><table><thead><tr><th>Grupo</th><th class="n">Ops.</th><th class="n">Documento gl</th><th class="n">Tanquero gl</th><th class="n">Tanque gl</th></tr></thead><tbody>${Object.keys(g).sort().map(k=>`<tr><td>${esc(k)}</td><td class="n">${g[k].n}</td><td class="n">${fmt(g[k].doc)}</td><td class="n">${fmt(g[k].tq)}</td><td class="n">${fmt(g[k].tk)}</td></tr>`).join('')}</tbody></table></div>`:''}
 <h2>Operaciones (${list.length})</h2>${opTable(list.slice().reverse())}

const blobB64=(b,full)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(full?fr.result:String(fr.result).split(',')[1]);fr.readAsDataURL(b)});
function dataUrlToBlob(du){const[h,b]=du.split(',');const mime=(/data:([^;]+)/.exec(h)||[])[1]||'application/octet-stream';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function saveFile(name,data){const d=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);if(!d){try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Archivo descargado: '+name);return true}catch(e){toast('No se pudo descargar: '+e.message);return false}}
 try{await d.save({filename:name,data});toast('Archivo listo: '+name);return true}catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='extension_not_enabled')toast('Este formato no está habilitado en esta vista; pruebe con JSON o CSV');else toast('No se pudo guardar: '+((e&&e.message)||(e&&e.code)));return false}}
function showLink(url,name){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box"><h3>Guardado en Google Drive</h3><p>${esc(name)}</p><p class="small" style="word-break:break-all"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></p><div class="row" style="justify-content:flex-end"><button class="btn pri" id="mo">Cerrar</button></div></div>`;document.body.appendChild(d);d.querySelector('#mo').onclick=()=>d.remove()}
async function driveSave(name,blob){const m=await (window.claude&&window.claude.use?window.claude.use('mcp'):null);if(!m){toast('Guardar en Drive no está disponible en esta vista; use Descargar');return false}
 try{const b64=await blobB64(blob);const r=await m.callTool('Google Drive','create_file',{title:name,base64Content:b64,contentMimeType:blob.type||'application/octet-stream',disableConversionToGoogleType:true});const p=r&&r.payload;if(p&&typeof p==='object'&&p.viewUrl)showLink(p.viewUrl,name);else toast('Guardado en Drive: '+name);return true}
 catch(e){const c=e&&e.code;if(c==='needs_reauth')toast('Reconecte Google Drive en Configuración → Conectores');else if(c==='server_not_connected')toast('Agregue Google Drive en Configuración → Conectores');else if(c==='not_in_manifest'||c==='blocked_by_policy'||c==='approval_required'||c==='not_granted')toast('Google Drive no está autorizado para esta app');else if(c==='tool_error')toast('Drive rechazó el archivo: '+(e.message||''));else toast('No se pudo guardar en Drive: '+((e&&e.message)||c));return false}}
const opRow=o=>{const s=o.sum||summ(o),f=o.f;return{'Operación':o.id,'Tipo':FLOW[o.tipo].n,'Estado':o.estado,'Fecha':f.fecha,'Hora inicio':f.horaIni,'Hora fin':f.horaFin,'Producto':f.producto||(tk(f.tank)||{}).producto||'','Tanque':f.tank+(f.tank2?' → '+f.tank2:''),'Placa':f.placa,'Conductor':f.conductor,'Cliente/Proveedor':f.proveedor||f.cliente||'','Documento':f.doc,'Documento gl':s.vDoc,'Tanquero gl':s.vTq,'Tanque gl':s.vTk,'Dif. gl':s.dg,'Dif. %':s.dp==null?null:Math.round(s.dp*100)/100,'Semáforo':SEMTXT[s.sem],'Operador':f.operador,'Sello':o.sello?o.sello.hash.slice(0,16):''}};

 d.querySelector('#xc').onclick=()=>d.remove();d.querySelector('#xman').onclick=()=>{d.remove();doExport('all','sys','file')};
 d.querySelector('#xin').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{toast('Actualizando su Excel…');const r=await updateExcelFile(f);const ok=await saveFile('Sistema_Inventario_LUBRIEC_actualizado.xlsx',r.blob);d.remove();if(ok){audit('actualizar Excel','',r.nops+' operaciones, '+r.n+' filas');showExcelDone(r)}}catch(err){toast(err.message||String(err))}}}
function showExcelDone(r){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box"><h3>Excel actualizado</h3><p><b>${r.nops}</b> operaciones · <b>${r.n}</b> filas cargadas en Importacion_App.</p><ol class="small"><li>Abra <b>Sistema_Inventario_LUBRIEC_actualizado.xlsx</b>.</li><li>Si Excel muestra "Vista protegida", pulse <b>Habilitar edición</b>: así se recalculan el inventario, el Dashboard y las alertas.</li><li>En Importacion_App revise "Control de la importación": debe decir ✔.</li><li>Guárdelo como su archivo de trabajo.</li></ol>${r.skip.length?`<div class="err"><b>No exportadas:</b><ul>${r.skip.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="row" style="justify-content:flex-end"><button class="btn pri" id="mo">Entendido</button></div></div>`;document.body.appendChild(d);d.querySelector('#mo').onclick=()=>d.remove()}
function expRow(sc,csv){const b=(f,l,d)=>`<button class="btn sm" onclick="doExport('${sc}','${f}','${d}')">${l}</button>`;return`<div class="card noprint"><div class="row"><b>Descargar</b>${b('xlsx','Excel','file')}${b('pdf','PDF','file')}${b('json','JSON','file')}${csv?b('csv','CSV','file'):''}</div><div class="row" style="margin-top:8px"><b>Guardar en Drive</b>${b('xlsx','Excel','drive')}${b('pdf','PDF','drive')}${b('json','JSON','drive')}</div><div class="row" style="margin-top:8px"><b>Excel de inventario</b><button class="btn sm pri" onclick="openSysMenu()">Pasar al Excel…</button>${b('sys','A Drive','drive')}</div></div>`}
let EXPBUSY=false;
async function doExport(sc,fmt,dest){if(EXPBUSY)return;EXPBUSY=true;try{toast('Preparando archivo…');const base=sc==='all'?'lubriec-respaldo':sc.startsWith('op:')?sc.slice(3):'lubriec-reporte';const st=today();let blob,name,info=null;
 if(fmt==='xlsx'){blob=buildXlsx(sc);name=`${base}-${st}.xlsx`}else if(fmt==='pdf'){blob=await buildPdf(sc);name=`${base}-${st}.pdf`}else if(fmt==='json'){blob=new Blob([await buildJson(sc)],{type:'application/json'});name=`${base}-${st}.json`}else if(fmt==='sys'){info=buildSysXlsx(sc);blob=info.blob;name=`inventario-movimientos-${st}.xlsx`}else{blob=new Blob([buildCsv(sc)],{type:'text/csv'});name=`${base}-${st}.csv`}
 const ok=dest==='drive'?await driveSave(name,blob):await saveFile(name,blob);if(ok){audit('exportar',sc,fmt+' → '+dest);if(info)showSysInfo(info)}}catch(e){toast('No se pudo generar: '+(e.message||e))}finally{EXPBUSY=false}}
function choose(msg,labels){return new Promise(res=>{const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end">${labels.map((l,i)=>`<button class="btn ${i===0?'pri':''}" data-i="${i}">${esc(l)}</button>`).join('')}</div></div>`;document.body.appendChild(d);d.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.remove();res(+b.dataset.i)})})}
async function putPhotos(list){let n=0;for(const p of list||[]){if(!p||!p.data)continue;if(await IDB.get('photos',p.id))continue;await IDB.put('photos',p.id,{blob:dataUrlToBlob(p.data),meta:p.meta});n++}return n}
async function mergeOps(ops,photos){let n=0,sk=0;for(const o of ops||[]){if(!o||!o.id||S.ops.some(x=>x.id===o.id)){sk++;continue}S.ops.push(o);const mt=/^([A-Z]+)-(\d{4})-(\d+)$/.exec(o.id);if(mt){const k=mt[1]+'-'+mt[2];S.counters[k]=Math.max(S.counters[k]||0,+mt[3])}n++}await putPhotos(photos);audit('importar operaciones','',n+' nuevas, '+sk+' ya existentes');save();return[n,sk]}
async function importJSON(el){const f=el.files[0];el.value='';if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){toast('El archivo no es un JSON válido');return}
 if(!j||j.app!=='lubriec-control'){toast('No es un archivo de LUBRIEC');return}
 if(j.state){const c=await choose('Respaldo completo de '+(j.ts?fts(j.ts):'fecha desconocida')+'. Combinar agrega solo lo que falta (no modifica operaciones existentes). Reemplazar sustituye todos los datos de este dispositivo.',['Combinar','Reemplazar','Cancelar']);if(c===2)return;
  if(c===0){const[n,sk]=await mergeOps(j.state.ops,j.photos);const st=j.state;(st.users||[]).forEach(u=>{if(!S.users.some(x=>x.id===u.id))S.users.push(u)});Object.entries(st.counters||{}).forEach(([k,v])=>{S.counters[k]=Math.max(S.counters[k]||0,v)});(st.closures||[]).forEach(cl=>{if(!S.closures.some(x=>x.fecha===cl.fecha&&x.ts===cl.ts))S.closures.push(cl)});(st.audit||[]).forEach(a=>{if(!S.audit.some(x=>x.ts===a.ts&&x.action===a.action&&x.ref===a.ref&&x.user===a.user))S.audit.push(a)});S.audit.sort((a,b)=>a.ts<b.ts?-1:1);save();toast(n+' operaciones nuevas · '+sk+' ya existían');go('home');return}
  if(!await confirmBox('Se reemplazarán los datos de este dispositivo. ¿Continuar?'))return;S=j.state;migrateInv();await putPhotos(j.photos);await IDB.put('kv','state',S);audit('importar respaldo','',f.name);toast('Respaldo importado');go('home');return}
 if(j.ops){const[n,sk]=await mergeOps(j.ops,j.photos);toast(n+' operaciones nuevas · '+sk+' ya existían');go('hist');return}
 toast('El archivo no contiene datos reconocibles')}
/* ============ datos maestros ============ */
function rMaes(){const tab=V.p.tab||'tk';const ro=!isSup();const T=[['tk','Tanques'],['tq','Tanqueros'],['pa','Productos y socios'],['us','Usuarios'],['pr','Parámetros'],['bk','Respaldo']];
 return`${back()}<h1>Datos maestros</h1>${ro?'<div class="note">Solo un Supervisor puede modificar los datos maestros.</div>':''}<div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('maes',{tab:'${t[0]}'})">${t[1]}</button>`).join('')}</div><fieldset ${ro&&tab!=='bk'?'disabled':''}>${({tk:mTk,tq:mTq,pa:mPa,us:mUs,pr:mPr,bk:mBk})[tab]()}</fieldset>`}
const sI=(p,v,l,t,h)=>fld(l,`<input data-s="${p}" ${t==='n'?'type="number" inputmode="decimal" step="any" data-t="n"':'type="text"'} value="${esc(v==null?'':v)}">`,h);
const sS=(p,v,l,o)=>fld(l,`<select data-s="${p}">${o.map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${esc(a[0])}" ${a[0]===v?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`);
function mTk(){return`<div class="note small">Aforo: los tanques verticales usan el volumen del cilindro por diámetro (método deducido del archivo de Francisco Morán, a validar con la tabla de calibración oficial). Si cuenta con la tabla, elija "Tabla de aforo" y péguela (mm, galones); entre dos puntos se interpola linealmente y fuera de rango no se extrapola.</div>`+S.tanks.map((t,i)=>`<details class="card"><summary><b>${esc(t.id)}</b> · ${esc(t.nombre)} ${t.estado!=='Activo'?'(inactivo)':''}</summary>
 <div class="grid2">${sI(`tanks.${i}.nombre`,t.nombre,'Nombre')}${sI(`tanks.${i}.producto`,t.producto,'Producto')}${sI(`tanks.${i}.cap`,t.cap,'Capacidad nominal (gl)','n')}${sS(`tanks.${i}.estado`,t.estado,'Estado',['Activo','Inactivo'])}
 ${sS(`tanks.${i}.modelo`,t.modelo,'Método de aforo',[['vertical','Cilindro vertical'],['horizontal','Cilindro horizontal'],['tabla','Tabla de aforo']])}${sI(`tanks.${i}.diam`,t.diam,'Diámetro (mm)','n')}${sI(`tanks.${i}.largo`,t.largo,'Largo (mm, horizontal)','n')}${sI(`tanks.${i}.fm`,t.fm,'Fondo muerto (mm)','n')}
 ${sI(`tanks.${i}.calFecha`,t.calFecha,'Fecha de calibración',null,'Si no existe: '+PEND)}${sI(`tanks.${i}.calDoc`,t.calDoc,'Documento de calibración',null,'Si no existe: '+PEND)}
 ${sS(`tanks.${i}.recibe`,String(!!t.recibe),'Recibe de proveedores',[['true','Sí'],['false','No']]).replace('data-s','data-t="b" data-s')}${sS(`tanks.${i}.despacha`,String(!!t.despacha),'Despacha a clientes',[['true','Sí'],['false','No']]).replace('data-s','data-t="b" data-s')}</div>
 ${fld('Tabla de aforo (mm, galones por línea)',`<textarea data-t="tabla" data-s="tanks.${i}.tabla" placeholder="0, 0&#10;100, 901">${esc((t.tabla||[]).map(p=>p.join(', ')).join('\n'))}</textarea>`,t.tabla?t.tabla.length+' puntos cargados':'Sin tabla')}
 <div class="small mut">Método vigente: ${esc(metodoTxt(t))}. Saldo inicial: ${t.saldo==null?'<span class="pend">sin definir</span>':fmt(t.saldo)+' gl'}.${t.base?' Base: '+esc(t.base.fuente)+'.':''} ${esc(t.nota||'')}</div></details>`).join('')+`<button class="btn" onclick="addTank()">+ Agregar tanque</button>`}
function addTank(){S.tanks.push({id:'TK'+(S.tanks.length+1),nombre:'Nuevo tanque',producto:PEND,cap:null,modelo:'vertical',diam:null,largo:null,tabla:null,unidad:'mm',fm:null,estado:'Activo',calFecha:'',calDoc:'',recibe:false,despacha:false,saldo:null,saldoW:null,nota:''});audit('config','tanks','nuevo tanque');save();render()}
function mTq(){return S.tanqueros.map((t,i)=>`<details class="card"><summary><b>${esc(t.placa)}</b> · ${esc(t.conductor)}</summary><div class="grid2">${sI(`tanqueros.${i}.placa`,t.placa,'Placa')}${sI(`tanqueros.${i}.conductor`,t.conductor,'Conductor habitual')}${sI(`tanqueros.${i}.empresa`,t.empresa,'Empresa')}${sI(`tanqueros.${i}.unidad`,t.unidad,'Unidad de medición')}</div>${fld('Tabla de aforo del tanquero (mm, galones)',`<textarea data-t="tabla" data-s="tanqueros.${i}.tabla">${esc((t.tabla||[]).map(p=>p.join(', ')).join('\n'))}</textarea>`,t.tabla?t.tabla.length+' puntos':'Sin tabla: '+PEND+' (se ingresan galones manualmente)')}<div class="small mut">${esc(t.nota||'')}</div></details>`).join('')+`<button class="btn" onclick="S.tanqueros.push({placa:'NUEVA',conductor:'',empresa:'',unidad:'mm',tabla:null,nota:''});save();render()">+ Agregar tanquero</button>`}
function mPa(){const lst=(k,l)=>`<h3>${l}</h3>${S[k].map((v,i)=>`<div class="row">${sI(`${k}.${i}`,v,'')}</div>`).join('')}<button class="btn sm" onclick="S['${k}'].push('Nuevo');save();render()">+ Agregar</button>`;return lst('productos','Productos')+lst('proveedores','Proveedores')+lst('clientes','Clientes')}
function mUs(){return S.users.map((u,i)=>`<div class="card grid2">${sI(`users.${i}.name`,u.name,'Nombre')}${sS(`users.${i}.role`,u.role,'Rol',['Operario','Supervisor','Gerente'])}</div>`).join('')+`<button class="btn" onclick="addUser()">+ Agregar usuario</button><div class="note small">Los usuarios identifican quién mide, fotografía y cierra. Esta versión no usa contraseña: el control es por usuario activo y bitácora.</div>`}
function addUser(){const n='Nuevo usuario';S.users.push({id:'U'+Date.now(),name:n,role:'Operario'});audit('crear usuario','',n);save();render()}
function mPr(){const s=S.settings;return`<div class="card"><h3>Tolerancias de diferencia</h3><div class="note small">${s.tolWarn==null||s.tolRed==null?`<span class="pend">${PEND}</span> — no hay valores por defecto.`:'Valores definidos por la empresa.'} Dentro de "advertencia" = 🟢; entre advertencia y fuera de tolerancia = 🟡; sobre fuera de tolerancia = 🔴.</div><div class="grid2">${sI('settings.tolWarn',s.tolWarn,'Advertencia a partir de (%)','n')}${sI('settings.tolRed',s.tolRed,'Fuera de tolerancia sobre (%)','n')}</div></div>
 <div class="card"><h3>Procedimiento</h3><div class="grid2">${sI('settings.estabMin',s.estabMin,'Tiempo de estabilización (min)','n',s.estabMin==null?PEND:'')}${sS('settings.tempRequired',String(!!s.tempRequired),'Temperatura obligatoria',[['false','No'],['true','Sí']]).replace('data-s','data-t="b" data-s')}</div></div>
 <div class="card"><h3>Base del stock teórico</h3><div class="note small"><span class="pend">${PEND}:</span> qué volumen se considera "confirmado" para el stock teórico. Mientras tanto se usa el documento.</div><div class="grid2">${sS('settings.baseRecepcion',s.baseRecepcion,'Recepciones confirmadas según',[['documento','Documento'],['tanquero','Tanquero'],['tanque','Tanque receptor']])}${sS('settings.baseDespacho',s.baseDespacho,'Despachos confirmados según',[['documento','Documento'],['tanquero','Tanquero'],['tanque','Tanque de origen']])}</div></div>
 <div class="card"><button class="btn" onclick="aju()">± Registrar ajuste autorizado</button></div>`}
function aju(){if(!isSup()){toast('Solo un Supervisor puede registrar ajustes');return}const o=newOp('AJU');openOp(o.id)}
function mBk(){return`<div class="card"><h3 style="margin-top:0">Respaldo e intercambio de datos</h3><p class="small">Los datos y las fotos se guardan en este dispositivo. Exporte respaldos con regularidad. Una actualización de la aplicación no borra los datos. Al importar un respaldo puede <b>combinar</b> (agrega lo que falta sin tocar operaciones existentes) o <b>reemplazar</b>.</p><div class="row"><label class="btn pri">⬆ Importar JSON<input type="file" accept=".json,application/json" hidden onchange="importJSON(this)"></label></div></div>${expRow('all',true)}<div class="note small">El archivo JSON de respaldo incluye datos maestros, operaciones, bitácora y todas las fotos. Excel y PDF son para consulta e informes.</div>`}
/* ============ arranque ============ */
(async function(){await IDB.open();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 S=(await IDB.get('kv','state'))||seed();migrateInv();
 if(!S.users.length)setTimeout(onboarding,50);else if(!S.activeUser)setTimeout(()=>pickUser(),50);
 render()})();
</script>
